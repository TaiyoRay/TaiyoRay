<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 1200 22" width="1200" height="22" role="img"><style>@keyframes ember{0%,100%{opacity:.9}50%{opacity:.2}}@keyframes rise{0%{transform:translateY(0);opacity:0}14%{opacity:.55}70%{opacity:.3}100%{transform:translateY(-230px);opacity:0}}@keyframes gl{0%{transform:none}11%{transform:translateX(1200px)}100%{transform:translateX(1200px)}}@keyframes beat{0%,100%{opacity:1}50%{opacity:.5}}@keyframes spark{0%{transform:none}100%{transform:translateX(1300px)}}@keyframes flare{0%,46%,60%,100%{transform:scale(1)}53%{transform:scale(1.62)}}.mote{animation:rise var(--d) linear var(--o) infinite;opacity:0}#ember{animation:ember 3.6s ease-in-out infinite}#glint{animation:gl 6s ease-in-out 1.2s infinite}#dash{animation:beat 3.4s ease-in-out infinite}#spark{animation:spark 7s linear infinite}#dflare{transform-box:fill-box;transform-origin:center;animation:flare 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><radialGradient id="bnvig" cx="0.5" cy="0.42" r="0.95"><stop offset="0" stop-color="#131117"/><stop offset="1" stop-color="#0B0A0C"/></radialGradient><radialGradient id="emberg" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#C1272D" stop-opacity="0.42"/><stop offset="1" stop-color="#C1272D" stop-opacity="0"/></radialGradient><linearGradient id="spg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EAE4D6" stop-opacity="0"/><stop offset="0.5" stop-color="#EAE4D6" stop-opacity="0.85"/><stop offset="1" stop-color="#EAE4D6" stop-opacity="0"/></linearGradient></defs><rect width="1200" height="22" fill="url(#bnvig)"/><path d="M24,11 L1176,11" stroke="#B9B19E" stroke-width="1.3" opacity="0.34"/><rect id="spark" x="-70" y="9.6" width="46" height="2.8" fill="url(#spg)"/><path id="dflare" d="M600,4.5 L608.4,11 L600,17.5 L591.6,11 Z" fill="#C1272D"/></svg>